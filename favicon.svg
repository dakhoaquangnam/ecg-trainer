<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Medical Cyan & Deep Teal Academic Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a2540" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Clinical Rounded Squircle Foundation -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cyanGrad)" filter="url(#subtleGlow)"/>

  <!-- Subtle Precision ECG Grid Backdrop -->
  <path d="M12 18h40M12 32h40M12 46h40M22 12v40M32 12v40M42 12v40" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Diagnostic QRS Cardiac Vector Pulse Waveform -->
  <path d="M10 33h9l3-7 4 17 5-23 4 16 3-3h16" stroke="url(#pulseGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Academic Teaching & Heart Vector Accent in Top Right -->
  <path d="M48 14.5a3 3 0 0 0-4.24 0L43 15.26l-.76-.76a3 3 0 1 0-4.24 4.24l.76.76L43 23.74l4.24-4.24.76-.76a3 3 0 0 0 0-4.24z" fill="#38bdf8" fill-opacity="0.95"/>
</svg>
